server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      mvc:
        routes:
          - id: product-service-route
            uri: ${SERVICES_PRODUCT_URL:lb://product-service}
            predicates:
              - Path=/api/v1/products/**, /api/v1/categories/**
            filters:
              - CircuitBreaker=productCircuitBreaker,forward:/fallback/product
              - Retry=3

          - id: order-service-route
            uri: ${SERVICES_ORDER_URL:lb://order-service}
            predicates:
              - Path=/api/v1/orders/**
            filters:
              - CircuitBreaker=orderCircuitBreaker,forward:/fallback/order
              - Retry=3

          - id: payment-service-route
            uri: ${SERVICES_PAYMENT_URL:lb://payment-service}
            predicates:
              - Path=/api/v1/payments/**
            filters:
              - CircuitBreaker=paymentCircuitBreaker,forward:/fallback/payment
              - Retry=3

          - id: inventory-service-route
            uri: ${SERVICES_INVENTORY_URL:lb://inventory-service}
            predicates:
              - Path=/api/v1/inventory/**
            filters:
              - CircuitBreaker=inventoryCircuitBreaker,forward:/fallback/inventory
              - Retry=3

          - id: shipping-service-route
            uri: ${SERVICES_SHIPPING_URL:lb://shipping-service}
            predicates:
              - Path=/api/v1/shipments/**, /api/v1/shipping/**
            filters:
              - CircuitBreaker=shippingCircuitBreaker,forward:/fallback/shipping
              - Retry=3

          - id: customer-service-route
            uri: ${SERVICES_CUSTOMER_URL:lb://customer-service}
            predicates:
              - Path=/api/v1/customers/**
            filters:
              - CircuitBreaker=customerCircuitBreaker,forward:/fallback/customer
              - Retry=3

          - id: auth-service-route
            uri: ${SERVICES_CUSTOMER_URL:lb://customer-service}
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - CircuitBreaker=customerCircuitBreaker,forward:/fallback/customer
              - Retry=3

          - id: notification-service-route
            uri: ${SERVICES_NOTIFICATION_URL:lb://notification-service}
            predicates:
              - Path=/api/v1/notifications/**
            filters:
              - CircuitBreaker=notificationCircuitBreaker,forward:/fallback/notification
              - Retry=3

          # AI Assistant Mikroservisi Rotaları (Latency ve Sorumluluk İzolasyonu)
          - id: ai-actions-route
            uri: ${SERVICES_AI_ASSISTANT_URL:lb://ai-assistant-service}
            predicates:
              - Path=/agent/actions/**, /api/v1/chat/actions/**
            filters:
              # AI rotalarında kesinlikle Retry filtresi eklenmez (yan etkili onay ve mükerrer fatura riski)
              - CircuitBreaker=aiActionsCircuitBreaker,forward:/fallback/ai-actions

          - id: ai-chat-route
            uri: ${SERVICES_AI_ASSISTANT_URL:lb://ai-assistant-service}
            predicates:
              - Path=/agent, /agent/chat, /api/v1/chat, /api/v1/chat/chat
            filters:
              - CircuitBreaker=aiChatCircuitBreaker,forward:/fallback/ai-chat

          - id: ai-rag-answer-route
            uri: ${SERVICES_AI_ASSISTANT_URL:lb://ai-assistant-service}
            predicates:
              - Path=/rag/answer
            filters:
              - CircuitBreaker=aiRagAnswerCircuitBreaker,forward:/fallback/ai-rag

          - id: ai-rag-search-route
            uri: ${SERVICES_AI_ASSISTANT_URL:lb://ai-assistant-service}
            predicates:
              - Path=/rag/search
            filters:
              - CircuitBreaker=aiRagSearchCircuitBreaker,forward:/fallback/ai-rag

          - id: product-service-docs
            uri: ${SERVICES_PRODUCT_URL:lb://product-service}
            predicates:
              - Path=/v3/api-docs/product-service
            filters:
              - SetPath=/v3/api-docs

          - id: order-service-docs
            uri: ${SERVICES_ORDER_URL:lb://order-service}
            predicates:
              - Path=/v3/api-docs/order-service
            filters:
              - SetPath=/v3/api-docs

          - id: payment-service-docs
            uri: ${SERVICES_PAYMENT_URL:lb://payment-service}
            predicates:
              - Path=/v3/api-docs/payment-service
            filters:
              - SetPath=/v3/api-docs

          - id: inventory-service-docs
            uri: ${SERVICES_INVENTORY_URL:lb://inventory-service}
            predicates:
              - Path=/v3/api-docs/inventory-service
            filters:
              - SetPath=/v3/api-docs

          - id: shipping-service-docs
            uri: ${SERVICES_SHIPPING_URL:lb://shipping-service}
            predicates:
              - Path=/v3/api-docs/shipping-service
            filters:
              - SetPath=/v3/api-docs

          - id: customer-service-docs
            uri: ${SERVICES_CUSTOMER_URL:lb://customer-service}
            predicates:
              - Path=/v3/api-docs/customer-service
            filters:
              - SetPath=/v3/api-docs

          - id: notification-service-docs
            uri: ${SERVICES_NOTIFICATION_URL:lb://notification-service}
            predicates:
              - Path=/v3/api-docs/notification-service
            filters:
              - SetPath=/v3/api-docs

          - id: ai-assistant-service-docs
            uri: ${SERVICES_AI_ASSISTANT_URL:lb://ai-assistant-service}
            predicates:
              - Path=/v3/api-docs/ai-assistant-service
            filters:
              - SetPath=/v3/api-docs

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      ai-heavy:
        slidingWindowType: COUNT
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      productCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      inventoryCircuitBreaker:
        baseConfig: default
      shippingCircuitBreaker:
        baseConfig: default
      customerCircuitBreaker:
        baseConfig: default
      notificationCircuitBreaker:
        baseConfig: default
      aiChatCircuitBreaker:
        baseConfig: ai-heavy
        slowCallDurationThreshold: 45s
      aiRagAnswerCircuitBreaker:
        baseConfig: ai-heavy
        slowCallDurationThreshold: 35s
      aiActionsCircuitBreaker:
        baseConfig: default
      aiRagSearchCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      aiChatCircuitBreaker:
        timeoutDuration: 70s
      aiRagAnswerCircuitBreaker:
        timeoutDuration: 55s
      aiActionsCircuitBreaker:
        timeoutDuration: 20s
      aiRagSearchCircuitBreaker:
        timeoutDuration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] %-40.40logger{39} : %m%n"

security:
  jwt:
    secret: ${JWT_SECRET:dgl-super-secret-jwt-signing-key-commerce-platform-2026-secure}

rate-limiter:
  enabled: true
  trust-forwarded-for: false
  anonymous:
    limit: 10
    window-seconds: 60
  authenticated:
    limit: 60
    window-seconds: 60
  policies:
    # 1. AI Actions (Onay/Red vb.) - En spesifik rota, ilk sırada olmalı
    - name: ai-actions
      path-patterns:
        - "/agent/actions/**"
        - "/api/v1/chat/actions/**"
      limit: 20
      window-seconds: 60
      algorithm: SLIDING_WINDOW
      fail-mode: LOCAL
    # 2. AI Sohbet (Agent döngüsü, yüksek token ve işlem yükü)
    - name: ai-chat
      path-patterns:
        - "/agent"
        - "/agent/chat"
        - "/api/v1/chat"
        - "/api/v1/chat/chat"
      limit: 10
      window-seconds: 60
      algorithm: SLIDING_WINDOW
      fail-mode: LOCAL
    # 3. AI RAG Soru-Cevap (Üretim içeren arama)
    - name: ai-rag-answer
      path-patterns:
        - "/rag/answer"
      limit: 10
      window-seconds: 60
      algorithm: SLIDING_WINDOW
      fail-mode: LOCAL
    # 4. AI RAG Arama (Yalnızca vektör retrieval)
    - name: ai-rag-search
      path-patterns:
        - "/rag/search"
      limit: 30
      window-seconds: 60
      algorithm: SLIDING_WINDOW
      fail-mode: LOCAL

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Ürün Kataloğu (Product Service)
        url: /v3/api-docs/product-service
      - name: 2. Sipariş Yönetimi (Order Service)
        url: /v3/api-docs/order-service
      - name: 3. Müşteri & Kimlik Doğrulama (Customer & Auth Service)
        url: /v3/api-docs/customer-service
      - name: 4. Ödeme Servisi (Payment Service)
        url: /v3/api-docs/payment-service
      - name: 5. Stok Servisi (Inventory Service)
        url: /v3/api-docs/inventory-service
      - name: 6. Kargo Servisi (Shipping Service)
        url: /v3/api-docs/shipping-service
      - name: 7. Bildirim Servisi (Notification Service)
        url: /v3/api-docs/notification-service
      - name: 8. Poliglot Yapay Zeka Asistanı (AI Assistant Service)
        url: /v3/api-docs/ai-assistant-service

