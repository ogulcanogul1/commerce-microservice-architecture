server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      mvc:
        routes:
          - id: product-service-route
            uri: ${SERVICES_PRODUCT_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/products/**, /api/v1/categories/**
            filters:
              - CircuitBreaker=productCircuitBreaker,forward:/fallback/product
              - Retry=3

          - id: order-service-route
            uri: ${SERVICES_ORDER_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/orders/**
            filters:
              - CircuitBreaker=orderCircuitBreaker,forward:/fallback/order
              - Retry=3

          - id: payment-service-route
            uri: ${SERVICES_PAYMENT_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/payments/**
            filters:
              - CircuitBreaker=paymentCircuitBreaker,forward:/fallback/payment
              - Retry=3

          - id: inventory-service-route
            uri: ${SERVICES_INVENTORY_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/inventory/**
            filters:
              - CircuitBreaker=inventoryCircuitBreaker,forward:/fallback/inventory
              - Retry=3

          - id: shipping-service-route
            uri: ${SERVICES_SHIPPING_URL:http://localhost:8085}
            predicates:
              - Path=/api/v1/shipments/**, /api/v1/shipping/**
            filters:
              - CircuitBreaker=shippingCircuitBreaker,forward:/fallback/shipping
              - Retry=3

          - id: customer-service-route
            uri: ${SERVICES_CUSTOMER_URL:http://localhost:8086}
            predicates:
              - Path=/api/v1/customers/**
            filters:
              - CircuitBreaker=customerCircuitBreaker,forward:/fallback/customer
              - Retry=3

          - id: auth-service-route
            uri: ${SERVICES_CUSTOMER_URL:http://localhost:8086}
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - CircuitBreaker=customerCircuitBreaker,forward:/fallback/customer
              - Retry=3

          - id: notification-service-route
            uri: ${SERVICES_NOTIFICATION_URL:http://localhost:8087}
            predicates:
              - Path=/api/v1/notifications/**
            filters:
              - CircuitBreaker=notificationCircuitBreaker,forward:/fallback/notification
              - Retry=3

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      productCircuitBreaker:
        baseConfig: default
      orderCircuitBreaker:
        baseConfig: default
      paymentCircuitBreaker:
        baseConfig: default
      inventoryCircuitBreaker:
        baseConfig: default
      shippingCircuitBreaker:
        baseConfig: default
      customerCircuitBreaker:
        baseConfig: default
      notificationCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] %-40.40logger{39} : %m%n"

security:
  jwt:
    secret: ${JWT_SECRET:dgl-super-secret-jwt-signing-key-commerce-platform-2026-secure}

rate-limiter:
  enabled: true
  anonymous:
    limit: 10
    window-seconds: 60
  authenticated:
    limit: 60
    window-seconds: 60

