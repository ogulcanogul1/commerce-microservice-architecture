version: '3.8'

# Commerce Platform - Mikroservis Uygulama Konteynerleri
# Çalıştırma: docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build

services:
  # 0. Eureka Server (Port: 8761) - Service Registry & Discovery
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: commerce/eureka-server:latest
    container_name: commerce-eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOSTNAME=eureka-server
    networks:
      - commerce-network

  # 0.1. Config Server (Port: 8888) - Merkezi Konfigürasyon Sunucusu (Spring Cloud Config)
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: commerce/config-server:latest
    container_name: commerce-config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=native
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - commerce-network

  # 1. Product Service (Port: 8081) - Ürün & Kategori Kataloğu, Redis Önbellek
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: commerce/product-service:latest
    container_name: commerce-product-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - OUTBOX_POLLER_ENABLED=false
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 2. Order Service (Port: 8082) - Sipariş Yaşam Döngüsü & Saga Orkestratörü
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: commerce/order-service:latest
    container_name: commerce-order-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/order_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - OUTBOX_POLLER_ENABLED=false
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 3. Payment Service (Port: 8083) - Ödeme Provizyonu, Tahsilat & İade
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: commerce/payment-service:latest
    container_name: commerce-payment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - OUTBOX_POLLER_ENABLED=false
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 4. Inventory Service (Port: 8084) - Stok Rezervasyonu & İyimser Kilitleme
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    image: commerce/inventory-service:latest
    container_name: commerce-inventory-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - OUTBOX_POLLER_ENABLED=false
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 5. Shipping Service (Port: 8085) - Kargo Gönderimi & Takip Numarası
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    image: commerce/shipping-service:latest
    container_name: commerce-shipping-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shipping_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - OUTBOX_POLLER_ENABLED=false
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 6. Customer Service (Port: 8086) - Müşteri Profilleri & JWT Kimlik Doğrulama
  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    image: commerce/customer-service:latest
    container_name: commerce-customer-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - OUTBOX_POLLER_ENABLED=false
      - JWT_SECRET=dgl-super-secret-jwt-signing-key-commerce-platform-2026-secure
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 7. Notification Service (Port: 8087) - E-Posta / SMS Bildirim Simülasyonu
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: commerce/notification-service:latest
    container_name: commerce-notification-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 8. AI Assistant Service (Port: 8089) - Poliglot Python FastAPI LLM Ajanı & Destek Motoru
  ai-assistant-service:
    build:
      context: ./ai-assistant-service
      dockerfile: Dockerfile
    image: commerce/ai-assistant-service:latest
    expose:
      - "8089"
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8089/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SERVICE_NAME=ai-assistant-service
      - PORT=8089
      - EUREKA_ENABLED=true
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - EUREKA_PREFER_IP=true
      - CONFIG_SERVER_ENABLED=true
      - CONFIG_SERVER_URL=http://config-server:8888/
      - TOKEN_BUDGET_ENABLED=true
      - GATEWAY_SECURITY_ENABLED=true
      - GATEWAY_INTERNAL_SECRET=dgl-internal-gateway-secret-token-2026
      - ORDER_SERVICE_URL=http://order-service:8082
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - SHIPPING_SERVICE_URL=http://shipping-service:8085
      - INVENTORY_SERVICE_URL=http://inventory-service:8084
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://host.docker.internal:11434/v1}
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - commerce-network

  # 9. API Gateway (Port: 8080) - Ters Proxy, JWT Doğrulama, Rate Limiter & Circuit Breaker
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: commerce/api-gateway:latest
    container_name: commerce-api-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      - JWT_SECRET=dgl-super-secret-jwt-signing-key-commerce-platform-2026-secure
    depends_on:
      - eureka-server
      - config-server
      - product-service
      - order-service
      - payment-service
      - inventory-service
      - shipping-service
      - customer-service
      - notification-service
      - ai-assistant-service
      - redis
    networks:
      - commerce-network

networks:
  commerce-network:
    name: commerce-network
    driver: bridge
