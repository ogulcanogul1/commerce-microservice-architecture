version: '3.8'

services:
  # PostgreSQL 16: Her mikroservis için izole veritabanları (docker/init-db.sql ile otomatik açılır)
  postgres:
    image: postgres:16-alpine
    container_name: commerce-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7: Ürün servisi önbellekleme ve API Gateway hız sınırı (Rate Limiter)
  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Kafka (KRaft Modu - ZooKeeper gerektirmez, hızlı ve hafiftir)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: commerce-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Kafka UI: Olayları ve mesaj akışını tarayıcıdan görsel izlemek için (http://localhost:8090)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: commerce-kafka-ui
    ports:
      - "8090:8090"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # Prometheus: Mikroservis metriklerini (/actuator/prometheus) periyodik toplar (http://localhost:9090)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: commerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana Tempo: Dağıtık izleme (Distributed Tracing - OpenTelemetry OTLP) backend'i
  tempo:
    image: grafana/tempo:2.4.1
    container_name: commerce-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/monitoring/tempo/tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200" # Tempo HTTP query port
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver (Spring Boot default)

  # Grafana Loki: Yapısal log kümeleme ve indeksleme (http://localhost:3100)
  loki:
    image: grafana/loki:2.9.6
    container_name: commerce-loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./docker/monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  # Promtail: Konteyner loglarını Loki'ye aktarır
  promtail:
    image: grafana/promtail:2.9.6
    container_name: commerce-promtail
    command: [ "-config.file=/etc/promtail/config.yml" ]
    volumes:
      - ./docker/monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  # Grafana: Metrikler, Dağıtık İzler ve Loglar için tekil gözlemlenebilirlik arayüzü (http://localhost:3000)
  grafana:
    image: grafana/grafana:10.4.1
    container_name: commerce-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  grafana_data:

