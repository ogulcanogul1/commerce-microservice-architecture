# ==============================================================================
# Commerce Platform - Central Global Configuration (Inherited by ALL services)
# ==============================================================================

server:
  shutdown: graceful

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka:
  topic:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}

outbox:
  retention:
    enabled: true
    days: ${OUTBOX_RETENTION_DAYS:7}
    cron: "${OUTBOX_RETENTION_CRON:0 0 3 * * ?}"

idempotency:
  retention:
    enabled: true
    days: ${IDEMPOTENCY_RETENTION_DAYS:7}
    cron: "${IDEMPOTENCY_RETENTION_CRON:0 0 3 * * ?}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0       # 100% of traces captured for complete distributed observability
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [%15.15t] %-40.40logger{39} : %m%n"
