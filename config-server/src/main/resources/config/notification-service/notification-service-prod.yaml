# ==============================================================================
# Notification Service - Production Configuration
# ==============================================================================

spring:
  datasource:
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      leak-detection-threshold: 2000

notification:
  delivery-mode: AWS_SES_OR_SENDGRID  # Gerçek kurumsal e-posta sağlayıcısı

logging:
  level:
    com.dgl.notification: INFO
