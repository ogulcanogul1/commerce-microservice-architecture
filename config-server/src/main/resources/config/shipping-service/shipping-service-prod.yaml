# ==============================================================================
# Shipping Service - Production Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST:prod-postgres-cluster.internal}:5432/shipping_db?sslmode=require
    username: ${PROD_SHIPPING_DB_USER:shipping_app}
    password: ${PROD_SHIPPING_DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      leak-detection-threshold: 2000

shipping:
  carrier:
    mock-delivery-instant: false

logging:
  level:
    com.dgl.shipping: INFO
