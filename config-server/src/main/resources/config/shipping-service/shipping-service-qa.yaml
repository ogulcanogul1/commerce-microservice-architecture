# ==============================================================================
# Shipping Service - QA Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${QA_DB_HOST:qa-postgres.internal}:5432/shipping_db
    username: ${QA_DB_USER:qa_shipping_user}
    password: ${QA_DB_PASSWORD:qa_shipping_password}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15

shipping:
  carrier:
    mock-delivery-instant: false

logging:
  level:
    com.dgl.shipping: INFO
