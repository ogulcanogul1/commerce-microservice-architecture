# ==============================================================================
# Shipping Service - Development Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/shipping_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

shipping:
  carrier:
    mock-delivery-instant: true

logging:
  level:
    com.dgl.shipping: DEBUG
