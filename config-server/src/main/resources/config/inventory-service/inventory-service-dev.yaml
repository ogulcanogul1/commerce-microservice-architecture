# ==============================================================================
# Inventory Service - Development Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/inventory_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

inventory:
  reservation:
    ttl-seconds: 120           # Hızlı geliştirme rezervasyon süresi

logging:
  level:
    com.dgl.inventory: DEBUG
