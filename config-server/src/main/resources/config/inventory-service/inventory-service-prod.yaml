# ==============================================================================
# Inventory Service - Production Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST:prod-postgres-cluster.internal}:5432/inventory_db?sslmode=require
    username: ${PROD_INVENTORY_DB_USER:inventory_app}
    password: ${PROD_INVENTORY_DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      leak-detection-threshold: 2000

inventory:
  reservation:
    ttl-seconds: 900           # 15 dakika üretim rezervasyon süresi

logging:
  level:
    com.dgl.inventory: INFO
