# ==============================================================================
# Customer Service - Production Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${PROD_DB_HOST:prod-postgres-cluster.internal}:5432/customer_db?sslmode=require
    username: ${PROD_CUSTOMER_DB_USER:customer_app}
    password: ${PROD_CUSTOMER_DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 30000
      leak-detection-threshold: 2000

jwt:
  expiration-ms: 3600000       # 1 saat (sıkı üretim güvenliği)

logging:
  level:
    com.dgl.customer: INFO
