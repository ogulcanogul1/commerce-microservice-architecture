# ==============================================================================
# Customer Service - QA Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${QA_DB_HOST:qa-postgres.internal}:5432/customer_db
    username: ${QA_DB_USER:qa_customer_user}
    password: ${QA_DB_PASSWORD:qa_customer_password}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15

jwt:
  expiration-ms: 14400000      # 4 saat

logging:
  level:
    com.dgl.customer: INFO
