# ==============================================================================
# Customer Service - Development Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/customer_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

jwt:
  expiration-ms: 86400000      # 24 saat (geliştirici test kolaylığı)

logging:
  level:
    com.dgl.customer: DEBUG
