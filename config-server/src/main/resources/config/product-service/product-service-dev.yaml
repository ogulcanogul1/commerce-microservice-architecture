# ==============================================================================
# Product Service - Development Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/product_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

cache:
  redis:
    product-ttl-seconds: 300    # 5 dakika (hızlı geliştirme testi için)
    category-ttl-seconds: 600   # 10 dakika

logging:
  level:
    com.dgl.product: DEBUG
