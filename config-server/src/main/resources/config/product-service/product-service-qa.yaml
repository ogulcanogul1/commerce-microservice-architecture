# ==============================================================================
# Product Service - QA / Staging Configuration
# ==============================================================================

spring:
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      connection-timeout: 30000

cache:
  redis:
    product-ttl-seconds: 900    # 15 dakika
    category-ttl-seconds: 1800  # 30 dakika

logging:
  level:
    com.dgl.product: INFO
