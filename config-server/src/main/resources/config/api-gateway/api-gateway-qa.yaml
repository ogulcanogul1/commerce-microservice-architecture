# ==============================================================================
# API Gateway - QA Configuration
# ==============================================================================

spring:
  data:
    redis:
      host: ${QA_REDIS_HOST:qa-redis.internal}
      port: ${QA_REDIS_PORT:6379}

gateway:
  ratelimit:
    anonymous-quota-per-minute: 30
    authenticated-quota-per-minute: 120

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 50.0

logging:
  level:
    com.dgl.gateway: INFO
