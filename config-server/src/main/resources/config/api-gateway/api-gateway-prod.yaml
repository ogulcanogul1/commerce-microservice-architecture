# ==============================================================================
# API Gateway - Production Configuration
# ==============================================================================

spring:
  data:
    redis:
      host: ${PROD_REDIS_HOST:prod-redis-cluster.internal}
      port: ${PROD_REDIS_PORT:6379}
      password: ${PROD_REDIS_PASSWORD:}

gateway:
  ratelimit:
    anonymous-quota-per-minute: 10      # Sıkı üretim kotası (DDoS & Brute-force koruması)
    authenticated-quota-per-minute: 60

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s

logging:
  level:
    com.dgl.gateway: INFO
