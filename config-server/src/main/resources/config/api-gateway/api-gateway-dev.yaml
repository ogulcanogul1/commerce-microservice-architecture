# ==============================================================================
# API Gateway - Development Configuration
# ==============================================================================

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

gateway:
  ratelimit:
    anonymous-quota-per-minute: 60      # Geliştirme ortamında bol limit (60 req/min)
    authenticated-quota-per-minute: 300 # (300 req/min)

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50.0

logging:
  level:
    com.dgl.gateway: DEBUG
