# ==============================================================================
# Payment Service - Development Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/payment_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

payment:
  gateway:
    simulation-delay-ms: 100
    mock-failure-rate: 0.0

logging:
  level:
    com.dgl.payment: DEBUG
