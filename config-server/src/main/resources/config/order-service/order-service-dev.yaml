# ==============================================================================
# Order Service - Development Configuration
# ==============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/order_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5

saga:
  timeout:
    duration-seconds: 60        # Geliştirme ortamında askıda sipariş testleri için hızlı zaman aşımı
    check-interval-ms: 10000

logging:
  level:
    com.dgl.order: DEBUG
